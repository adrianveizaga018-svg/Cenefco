<main>
  <app-page-title title="Editar Docente" subtitle="Docentes" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Perfil del Docente</h4></div>
      <div class="p-6">
        @if (loading()) {
          <div class="flex items-center justify-center py-16 text-default-500 text-sm gap-2"><div class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Cargando...</div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Nombre Completo <span class="text-danger">*</span></label>
              <input type="text" formControlName="nombre_completo" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Título Académico</label>
              <input type="text" formControlName="titulo_academico" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Especialidad</label>
              <input type="text" formControlName="especialidad" class="form-input w-full">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-2">Foto del Docente</label>
              <div class="flex items-start gap-5">

                <div class="shrink-0">
                  @if (fotoPreview()) {
                    <img [src]="fotoPreview()" alt="Foto docente"
                         class="size-24 rounded-full object-cover border-2 border-default-200 shadow-sm">
                  } @else {
                    <div class="size-24 rounded-full bg-primary/10 flex items-center justify-center border-2 border-dashed border-primary/30">
                      <ng-icon name="lucideUser" class="size-10 text-primary/50" />
                    </div>
                  }
                </div>

                <div class="flex flex-col gap-2 pt-1">
                  <label class="cursor-pointer">
                    <input type="file" accept="image/*" class="hidden" (change)="onFotoSelected($event)" [disabled]="uploadingFoto()">
                    <span class="btn bg-default-100 text-default-700 text-sm flex items-center gap-2"
                          [class.opacity-50]="uploadingFoto()">
                      @if (uploadingFoto()) {
                        <div class="size-4 animate-spin"><ng-icon name="lucideLoader" /></div>
                        Subiendo...
                      } @else {
                        <ng-icon name="lucideUpload" class="size-4" />
                        {{ fotoPreview() ? 'Cambiar foto' : 'Subir foto' }}
                      }
                    </span>
                  </label>

                  @if (fotoPreview()) {
                    <button type="button" class="btn bg-danger/10 text-danger text-sm flex items-center gap-2"
                            (click)="removeFoto()">
                      <ng-icon name="lucideTrash2" class="size-4" />
                      Quitar foto
                    </button>
                  }

                  @if (form.value.foto_url) {
                    <p class="text-xs text-default-400 max-w-xs truncate" [title]="form.value.foto_url!">
                      {{ form.value.foto_url }}
                    </p>
                  }
                </div>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Alt de la Foto</label>
              <input type="text" formControlName="foto_alt" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Email Público</label>
              <input type="email" formControlName="email_publico" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Número de Celular</label>
              <input type="text" formControlName="telefono" class="form-input w-full" placeholder="Ej: +591 70000000">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">LinkedIn</label>
              <input type="text" formControlName="linkedin_url" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Twitter/X</label>
              <input type="text" formControlName="twitter_url" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Sitio Web</label>
              <input type="text" formControlName="sitio_web_url" class="form-input w-full">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Biografía</label>
              <textarea formControlName="biografia" rows="4" class="form-input w-full"></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Tipo</label>
              <input type="text" formControlName="tipo" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Estado</label>
              <select formControlName="estado" class="form-input w-full">
                <option value="publicado">Publicado</option><option value="borrador">Borrador</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Orden</label>
              <input type="number" formControlName="orden" class="form-input w-full" min="0">
            </div>
            <div class="flex items-center gap-2 pt-5">
              <input type="checkbox" formControlName="mostrar_en_web" id="mostrar" class="form-checkbox">
              <label for="mostrar" class="text-sm text-default-700">Visible en el portal web</label>
            </div>
            <div class="md:col-span-2 flex items-center gap-3">
              <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
                @if (submitting()) { <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando... } @else { Actualizar Docente }
              </button>
              <a routerLink="/cenefco/docentes-perfil" class="btn bg-default-200 text-default-700">Cancelar</a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</main>
