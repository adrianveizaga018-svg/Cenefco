<div class="relative flex items-center justify-center min-h-screen overflow-hidden"
     style="background: linear-gradient(135deg, var(--color-brand-primary-dark) 0%, var(--color-brand-primary) 100%)">

  <!-- Fondo animado -->
  <div class="absolute inset-0 opacity-10">
    <img src="assets/images/modern.svg" alt="" class="w-full h-full object-cover">
  </div>

  <div class="relative z-10 w-full max-w-md px-4">

    <!-- Card glassmorfismo -->
    <div class="rounded-2xl p-8 text-center"
         style="background: rgba(255,255,255,0.15); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.3);">

      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <img src="assets/images/cenefco.png" alt="CENEFCO" class="h-20 object-contain">
      </div>

      <!-- Título -->
      <h1 class="text-2xl font-bold text-white mb-1">¡Casi listo!</h1>
      <p class="text-white/60 text-sm mb-6">
        Necesitamos un par de datos más para completar tu perfil de estudiante.
      </p>

      <!-- Icono de paso -->
      <div class="flex items-center justify-center gap-3 mb-6">
        <div class="flex items-center gap-2 text-xs text-white/70">
          <div class="w-6 h-6 rounded-full bg-green-400 flex items-center justify-center">
            <ng-icon name="lucideCheck" class="size-3 text-white"></ng-icon>
          </div>
          <span>Cuenta Google</span>
        </div>
        <div class="w-8 h-px bg-white/30"></div>
        <div class="flex items-center gap-2 text-xs text-white font-medium">
          <div class="w-6 h-6 rounded-full bg-white/30 border-2 border-white flex items-center justify-center">
            <span class="text-white text-xs font-bold">2</span>
          </div>
          <span>Datos de identidad</span>
        </div>
      </div>

      <!-- Error -->
      @if (error()) {
        <div class="mb-4 rounded-lg bg-red-500/20 border border-red-400/40 px-4 py-3 text-sm text-white text-left">
          {{ error() }}
        </div>
      }

      <!-- Formulario -->
      <form (ngSubmit)="submit()" class="text-left space-y-4">

        <div>
          <label for="ci" class="block text-white/80 text-sm font-medium mb-1.5">
            Carnet de Identidad (CI) <span class="text-red-400">*</span>
          </label>
          <input
            type="text"
            id="ci"
            name="ci"
            [(ngModel)]="ci"
            placeholder="Ej: 1234567"
            required
            class="form-input w-full"
            style="background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); color: white;"
          />
          <p class="mt-1 text-xs text-white/40">
            Es el único dato que identifica tu cuenta y vincula tu historial académico.
          </p>
        </div>

        <div>
          <label for="telefono" class="block text-white/80 text-sm font-medium mb-1.5">
            Celular / WhatsApp <span class="text-red-400">*</span>
          </label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            [(ngModel)]="telefono"
            placeholder="Ej: 70000000"
            required
            class="form-input w-full"
            style="background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.25); color: white;"
          />
        </div>

        <button
          type="submit"
          class="btn bg-primary text-white w-full mt-2 transition-opacity"
          [disabled]="loading()"
          [class.opacity-60]="loading()">
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <span class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></span>
              Guardando...
            </span>
          } @else {
            Completar mi perfil →
          }
        </button>

      </form>
    </div>

    <p class="text-center text-white/30 text-xs mt-4">
      CENEFCO — Centro de Formación y Educación Continua
    </p>
  </div>
</div>
