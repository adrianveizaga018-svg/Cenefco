<div class="relative flex items-start justify-center min-h-screen overflow-y-auto"
     style="background: linear-gradient(135deg, var(--color-brand-primary-dark) 0%, var(--color-brand-primary) 100%)">

  <!-- Fondo animado -->
  <div class="absolute inset-0 opacity-10 pointer-events-none">
    <img src="assets/images/modern.svg" alt="" class="w-full h-full object-cover">
  </div>

  <div class="relative z-10 w-full max-w-lg px-4 py-10">

    <!-- Card glassmorphism -->
    <div class="rounded-2xl p-8"
         style="background: rgba(255,255,255,0.15); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 60px rgba(0,0,0,0.3);">

      <!-- Logo + Título -->
      <div class="text-center mb-6">
        <div class="flex justify-center mb-4">
          <img src="assets/images/cenefco.png" alt="CENEFCO" class="h-16 object-contain">
        </div>
        <h1 class="text-2xl font-bold text-white">Crear cuenta</h1>
        <p class="text-white/60 text-sm mt-1">Regístrate para acceder a tus cursos en CENEFCO</p>
      </div>

      <!-- Error global -->
      @if (error()) {
        <div class="mb-5 rounded-lg bg-red-500/20 border border-red-400/40 px-4 py-3 text-sm text-white">
          {{ error() }}
        </div>
      }

      <!-- Formulario -->
      <form (ngSubmit)="submit()" class="space-y-4">

        <!-- Nombre y Apellido -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="reg-nombre" class="block text-white/80 text-sm font-medium mb-1.5">
              Nombre <span class="text-red-400">*</span>
            </label>
            <input type="text" id="reg-nombre" name="nombre" [(ngModel)]="nombre"
              placeholder="Juan" required
              class="form-input w-full"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
          </div>
          <div>
            <label for="reg-apellido" class="block text-white/80 text-sm font-medium mb-1.5">
              Apellido <span class="text-red-400">*</span>
            </label>
            <input type="text" id="reg-apellido" name="apellido" [(ngModel)]="apellido"
              placeholder="Pérez" required
              class="form-input w-full"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="reg-email" class="block text-white/80 text-sm font-medium mb-1.5">
            Correo electrónico <span class="text-red-400">*</span>
          </label>
          <input type="email" id="reg-email" name="email" [(ngModel)]="email"
            placeholder="juan@ejemplo.com" required autocomplete="email"
            class="form-input w-full"
            style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
        </div>

        <!-- CI y Celular -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="reg-ci" class="block text-white/80 text-sm font-medium mb-1.5">
              Carnet de Identidad <span class="text-red-400">*</span>
            </label>
            <input type="text" id="reg-ci" name="ci" [(ngModel)]="ci"
              placeholder="Ej: 1234567" required
              class="form-input w-full"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
          </div>
          <div>
            <label for="reg-telefono" class="block text-white/80 text-sm font-medium mb-1.5">
              Celular / WhatsApp <span class="text-red-400">*</span>
            </label>
            <input type="tel" id="reg-telefono" name="telefono" [(ngModel)]="telefono"
              placeholder="Ej: 70000000" required
              class="form-input w-full"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
          </div>
        </div>

        <!-- Contraseña -->
        <div>
          <label for="reg-password" class="block text-white/80 text-sm font-medium mb-1.5">
            Contraseña <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <input [type]="showPassword() ? 'text' : 'password'"
              id="reg-password" name="password" [(ngModel)]="password"
              placeholder="Mínimo 8 caracteres" required autocomplete="new-password"
              class="form-input w-full pr-10"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
            <button type="button" (click)="showPassword.set(!showPassword())" tabindex="-1"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-white/50 hover:text-white">
              <span class="size-4"><ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'"></ng-icon></span>
            </button>
          </div>
        </div>

        <!-- Confirmar Contraseña -->
        <div>
          <label for="reg-password-confirm" class="block text-white/80 text-sm font-medium mb-1.5">
            Confirmar contraseña <span class="text-red-400">*</span>
          </label>
          <div class="relative">
            <input [type]="showConfirm() ? 'text' : 'password'"
              id="reg-password-confirm" name="passwordConfirm" [(ngModel)]="passwordConfirm"
              placeholder="Repite tu contraseña" required autocomplete="new-password"
              class="form-input w-full pr-10"
              style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.25);color:white;" />
            <button type="button" (click)="showConfirm.set(!showConfirm())" tabindex="-1"
              class="absolute inset-y-0 right-0 flex items-center px-3 text-white/50 hover:text-white">
              <span class="size-4"><ng-icon [name]="showConfirm() ? 'lucideEyeOff' : 'lucideEye'"></ng-icon></span>
            </button>
          </div>
        </div>

        <!-- Botón registrar -->
        <button type="submit"
          class="btn bg-primary text-white w-full mt-2 transition-opacity"
          [disabled]="loading()" [class.opacity-60]="loading()">
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <span class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></span>
              Creando cuenta...
            </span>
          } @else {
            Crear mi cuenta
          }
        </button>

        <!-- Divisor -->
        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-white/20"></div>
          <span class="flex-shrink-0 mx-4 text-white/50 text-xs uppercase tracking-wider">o regístrate con</span>
          <div class="flex-grow border-t border-white/20"></div>
        </div>

        <!-- Botón Google -->
        <div id="google-register-btn" class="flex justify-center w-full"></div>

      </form>

      <!-- Link a Login -->
      <p class="text-center text-white/50 text-sm mt-6">
        ¿Ya tienes cuenta?
        <a routerLink="/auth-modern/login" class="text-white font-semibold hover:underline ml-1">
          Iniciar sesión
        </a>
      </p>

    </div>

    <p class="text-center text-white/30 text-xs mt-4">
      CENEFCO — Centro de Formación y Educación Continua
    </p>
  </div>
</div>
