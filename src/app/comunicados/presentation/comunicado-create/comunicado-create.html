<main>
  <app-page-title title="Nuevo Comunicado" subtitle="Contenido" />

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="grid lg:grid-cols-3 grid-cols-1 gap-5">

      <div class="lg:col-span-2">
        <div class="card">
          <div class="card-header"><h6 class="card-title">Datos del Comunicado</h6></div>
          <div class="card-body space-y-4">

            <div>
              <label class="block mb-1.5 text-sm font-medium text-default-800">
                Título <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-input" placeholder="Título del comunicado" formControlName="titulo">
              @if (form.get('titulo')?.invalid && form.get('titulo')?.touched) {
                <p class="mt-1 text-danger text-xs">Este campo es requerido (máximo 255 caracteres)</p>
              }
            </div>

            <div>
              <label class="block mb-1.5 text-sm font-medium text-default-800">
                Estado <span class="text-danger">*</span>
              </label>
              <select class="form-select" formControlName="estado">
                <option value="borrador">Borrador</option>
                <option value="publicado">Publicado</option>
                <option value="archivado">Archivado</option>
              </select>
            </div>

          </div>
        </div>
      </div>

      <div class="space-y-5">
        <div class="card">
          <div class="card-header"><h6 class="card-title">Acciones</h6></div>
          <div class="card-body flex flex-col gap-2">
            <button type="submit" class="btn bg-primary text-white w-full" [disabled]="form.invalid || submitting()">
              @if (submitting()) {
                <div class="size-4 me-1 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div>
                Guardando...
              } @else {
                Crear Comunicado
              }
            </button>
            <a routerLink="/cenefco/comunicados" class="btn border border-default-300 text-default-600 hover:bg-default-100 w-full text-center">
              Cancelar
            </a>
          </div>
        </div>
      </div>

    </div>
  </form>
</main>
