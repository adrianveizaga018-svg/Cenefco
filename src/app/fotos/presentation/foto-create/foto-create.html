<main>
  <app-page-title title="Nueva Foto" subtitle="Galería de Fotos" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Datos de la Foto</h4></div>
      <div class="p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-default-700 mb-1">Título <span class="text-danger">*</span></label>
            <input type="text" formControlName="titulo_foto" class="form-input w-full" placeholder="Título de la foto">
            @if (form.get('titulo_foto')?.invalid && form.get('titulo_foto')?.touched) { <p class="text-danger text-xs mt-1">El título es requerido</p> }
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-default-700 mb-2">Imagen</label>
            @if (previewUrl()) {
              <div class="relative inline-block mb-3">
                <img [src]="previewUrl()!" alt="Preview" class="h-48 w-auto rounded-lg object-cover border border-default-200">
                @if (uploadingImg()) {
                  <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-lg">
                    <div class="size-6 animate-spin text-white"><ng-icon name="lucideLoader"></ng-icon></div>
                  </div>
                } @else {
                  <button type="button" (click)="removeImage()"
                          class="absolute -top-2 -right-2 size-6 rounded-full bg-danger text-white flex items-center justify-center hover:bg-red-600">
                    <div class="size-3"><ng-icon name="lucideX"></ng-icon></div>
                  </button>
                }
              </div>
            }
            <label class="flex items-center gap-2 cursor-pointer w-fit">
              <div class="btn bg-default-200 text-default-700 hover:bg-default-300 flex items-center gap-2">
                <div class="size-4"><ng-icon name="lucideUpload"></ng-icon></div>
                @if (uploadingImg()) { Subiendo... } @else { Seleccionar imagen }
              </div>
              <input type="file" accept="image/*" class="hidden" (change)="onImageSelected($event)" [disabled]="uploadingImg()">
            </label>
            <p class="text-default-400 text-xs mt-1">JPG, PNG o WEBP · Máx. 20 MB</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Fecha</label>
            <input type="date" formControlName="fecha_foto" class="form-input w-full">
          </div>
          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Estado</label>
            <select formControlName="estado" class="form-input w-full">
              <option [value]="1">Activo</option>
              <option [value]="0">Inactivo</option>
            </select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-default-700 mb-1">Descripción</label>
            <textarea formControlName="descripcion_foto" rows="3" class="form-input w-full" placeholder="Descripción de la foto..."></textarea>
          </div>
          <div class="md:col-span-2 flex items-center gap-3">
            <button type="submit" class="btn bg-primary text-white" [disabled]="submitting() || uploadingImg()">
              @if (submitting()) { <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando... }
              @else { Guardar Foto }
            </button>
            <a routerLink="/cenefco/fotos" class="btn bg-default-200 text-default-700">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
