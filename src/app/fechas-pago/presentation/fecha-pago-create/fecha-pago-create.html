<main>
  <app-page-title title="Nueva Cuota de Pago" subtitle="Planes Académicos" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Datos de la Cuota</h4></div>
      <div class="p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-default-700 mb-1">Plan de Pago <span class="text-danger">*</span></label>
            <select formControlName="id_plan" class="form-input w-full">
              <option [ngValue]="null">— Seleccionar plan —</option>
              @for (p of planes(); track p.id_plan) {
                <option [value]="p.id_plan">{{ planLabel(p) }}</option>
              }
            </select>
            @if (form.get('id_plan')?.invalid && form.get('id_plan')?.touched) {
              <p class="text-danger text-xs mt-1">Selecciona un plan</p>
            }
          </div>

          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">N° de Cuota</label>
            <input type="text" formControlName="nro_pago" class="form-input w-full" placeholder="Ej: 1, 1ra cuota, Inscripción">
          </div>

          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Tipo de Trámite</label>
            <input type="text" formControlName="tipo_tramite" class="form-input w-full" placeholder="Ej: Inscripción, Cuota, Mensualidad">
          </div>

          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Monto a Pagar (Bs.)</label>
            <input type="number" step="0.01" min="0" formControlName="monto_a_pagar" class="form-input w-full" placeholder="Ej: 500.00">
          </div>

          <div class="flex items-center gap-3 pt-6">
            <label class="relative inline-flex items-center cursor-pointer">
              <input type="checkbox" class="sr-only peer" [checked]="form.get('obligatorio')?.value === 1"
                (change)="form.get('obligatorio')?.setValue($any($event.target).checked ? 1 : 0)">
              <div class="w-11 h-6 bg-default-200 peer-checked:bg-primary rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
              <span class="ms-2 text-sm text-default-700">Cuota obligatoria</span>
            </label>
          </div>

          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Fecha Inicio vigencia</label>
            <input type="date" formControlName="fecha_inicio" class="form-input w-full">
          </div>

          <div>
            <label class="block text-sm font-medium text-default-700 mb-1">Fecha Fin vigencia</label>
            <input type="date" formControlName="fecha_fin" class="form-input w-full">
          </div>

          <div class="md:col-span-2 flex items-center gap-3">
            <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
              @if (submitting()) {
                <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando...
              } @else { Guardar Cuota }
            </button>
            <a routerLink="/cenefco/fechas-pago" class="btn bg-default-200 text-default-700">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
