<main>
  <app-page-title title="Nueva Configuración Académica" subtitle="Catálogos Académicos" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Parámetros de Configuración</h4></div>
      <div class="p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div><label class="block text-sm font-medium text-default-700 mb-1">Gestión</label><input type="text" formControlName="gestion" class="form-input w-full" placeholder="Ej: 2026"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Periodo Estudiante</label><input type="text" formControlName="periodo_est" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Gestión Estudiante</label><input type="text" formControlName="gestion_est" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Máx. Materias a Cursar</label><input type="text" formControlName="max_materias_cursar" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">ID Plan</label><input type="number" formControlName="id_plan" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">ID Plan Anterior</label><input type="number" formControlName="id_plan_anterior" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Nombre Director</label><input type="text" formControlName="nombre_director" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Nombre Kardista</label><input type="text" formControlName="nombre_kardista" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Título Carrera</label><input type="text" formControlName="titulo_carrera" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Carrera</label><input type="text" formControlName="carrera" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Área</label><input type="text" formControlName="area" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Periodo</label><input type="text" formControlName="periodo" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Lugar</label><input type="text" formControlName="lugar_x" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Correlativo</label><input type="text" formControlName="correlativo" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Código</label><input type="text" formControlName="cod_codigo" class="form-input w-full"></div>
          <div><label class="block text-sm font-medium text-default-700 mb-1">Estado</label><select formControlName="estado" class="form-input w-full"><option [value]="1">Activo</option><option [value]="0">Inactivo</option></select></div>
          <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Descripción Resolución</label><input type="text" formControlName="descripcion_resolucion" class="form-input w-full"></div>
          <div class="md:col-span-2 flex items-center gap-3">
            <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
              @if (submitting()) { <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando... } @else { Guardar Configuración }
            </button>
            <a routerLink="/cenefco/configuracion-academica" class="btn bg-default-200 text-default-700">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
