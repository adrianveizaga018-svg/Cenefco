<main>
  <app-page-title title="Editar Documento" subtitle="Documentos Académicos" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Datos del Documento</h4></div>
      <div class="p-6">
        @if (loading()) {
          <div class="flex items-center justify-center py-16 text-default-500 text-sm gap-2">
            <div class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Cargando...
          </div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">ID FechaPago</label>
              <input type="number" formControlName="id_fechapago" class="form-input w-full" placeholder="ID de fecha de pago">
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">ID FechaDoc</label>
              <input type="number" formControlName="id_fechadoc" class="form-input w-full" placeholder="ID de fecha del documento">
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Fecha Dejó Físico</label>
              <input type="date" formControlName="fecha_dejo_fisico" class="form-input w-full">
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Dejó Documento Físico</label>
              <input type="number" formControlName="dejo_documento_fisico" class="form-input w-full" placeholder="0 o 1">
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Documento Digital</label>
              <input type="text" formControlName="documento_digital" class="form-input w-full" placeholder="URL o nombre del archivo">
            </div>

            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Estado</label>
              <select formControlName="estado" class="form-input w-full">
                <option [value]="1">Activo</option>
                <option [value]="0">Inactivo</option>
              </select>
            </div>

            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Observación</label>
              <textarea formControlName="observacion_doc" class="form-input w-full" rows="3" placeholder="Observaciones adicionales"></textarea>
            </div>

            <div class="md:col-span-2 flex items-center gap-3">
              <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
                @if (submitting()) {
                  <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando...
                } @else { Actualizar Documento }
              </button>
              <a routerLink="/cenefco/documentos-academicos" class="btn bg-default-200 text-default-700">Cancelar</a>
            </div>

          </form>
        }
      </div>
    </div>
  </div>
</main>
