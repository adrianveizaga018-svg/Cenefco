<app-page-title title="Nueva Universidad" subtitle="Universidades" />

<div class="card" style="max-width:640px">
  <div class="card-body">
    <div class="mb-3">
      <label class="form-label">Nombre <span class="text-danger">*</span></label>
      <input type="text" class="form-control" [(ngModel)]="form.nombre_universidad" />
    </div>
    <div class="mb-3">
      <label class="form-label">Estado</label>
      <select class="form-select" [(ngModel)]="form.estado">
        <option [value]="1">Activo</option>
        <option [value]="0">Inactivo</option>
      </select>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary" (click)="save()" [disabled]="saving()">Guardar</button>
      <a routerLink="/cenefco/universidades" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </div>
</div>
