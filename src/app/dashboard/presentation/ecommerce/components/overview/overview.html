<div class="grid lg:grid-cols-6 md:grid-cols-3 grid-cols-2 gap-4">
  @for (stat of stats; track $index) {
    <a [routerLink]="stat.link"
       class="card hover:shadow-lg hover:-translate-y-0.5 transition-all duration-200 cursor-pointer group">
      <div class="card-body p-4">
        <div class="flex items-start justify-between mb-3">
          <div class="size-11 rounded-xl flex items-center justify-center {{ stat.bgClass }} group-hover:scale-110 transition-transform duration-200">
            <div class="size-5 {{ stat.textClass }}">
              <ng-icon [name]="stat.icon" />
            </div>
          </div>
          <div class="size-4 text-default-300 group-hover:text-default-500 transition-colors">
            <ng-icon name="lucideArrowUpRight" />
          </div>
        </div>
        <h5 class="text-2xl font-bold text-default-800 leading-tight tabular-nums">{{ stat.value }}</h5>
        <p class="text-xs text-default-400 mt-1 leading-snug">{{ stat.label }}</p>
      </div>
    </a>
  }
</div>
