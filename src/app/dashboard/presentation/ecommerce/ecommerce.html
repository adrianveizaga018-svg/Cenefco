<main>
  <app-page-title title="Dashboard" subtitle="CENEFCO" />

  @if (loading()) {
    <div class="flex items-center justify-center py-24 text-default-500 text-sm gap-2">
      <div class="size-5 animate-spin"><ng-icon name="lucideLoader" /></div>
      Cargando datos...
    </div>

  } @else if (stats()) {

    <div class="mb-4">
      <app-overview [resumen]="stats()!.resumen" />
    </div>

    <div class="mb-5">
      <app-banner />
    </div>

  } @else {
    <div class="flex flex-col items-center justify-center py-24 text-default-400 gap-3">
      <div class="size-12 text-danger/40"><ng-icon name="lucideAlertCircle" /></div>
      <p class="text-sm">No se pudieron cargar los datos del dashboard.</p>
      <button class="btn btn-sm bg-primary text-white" (click)="reload()">Reintentar</button>
    </div>
  }
</main>
