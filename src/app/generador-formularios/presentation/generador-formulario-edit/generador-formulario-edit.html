<main>
  <app-page-title title="Editar Formulario" subtitle="Generador de Formularios" />

  <a routerLink="/cenefco/generador-formularios"
     class="inline-flex items-center gap-1.5 text-sm text-default-500 hover:text-primary mb-5">
    <ng-icon name="lucideArrowLeft" class="size-4"></ng-icon>
    Volver al listado
  </a>

  @if (loading()) {
    <div class="flex items-center justify-center py-24 text-default-400 gap-3">
      <ng-icon name="lucideLoader" class="size-6 animate-spin"></ng-icon>
      Cargando...
    </div>
  } @else {
    <div class="max-w-2xl">
      <div class="card">
        <div class="card-header border-b border-default-200">
          <div class="flex items-center gap-2">
            <div class="size-4 text-violet-500"><ng-icon name="lucideFileText"></ng-icon></div>
            <h6 class="text-sm font-semibold text-default-800">Datos del formulario</h6>
          </div>
        </div>
        <div class="p-5 space-y-4">

          <div>
            <label class="block text-xs font-medium text-default-600 mb-1">
              Nombre <span class="text-danger">*</span>
            </label>
            <input type="text" class="form-input w-full"
              placeholder="Ej: Inscripción a Diplomado"
              [ngModel]="nombre()"
              (ngModelChange)="onNombreChange($event)" />
          </div>

          <div>
            <label class="block text-xs font-medium text-default-600 mb-1">Slug (URL amigable)</label>
            <input type="text" class="form-input w-full font-mono text-sm"
              [ngModel]="slug()"
              (ngModelChange)="slug.set($event)" />
            <p class="text-xs text-default-400 mt-0.5">
              Identificador único para este formulario. Se genera automáticamente al cambiar el nombre.
            </p>
          </div>

          <div>
            <label class="block text-xs font-medium text-default-600 mb-1">Descripción</label>
            <textarea rows="3" class="form-input w-full resize-none"
              placeholder="Para qué sirve este formulario..."
              [ngModel]="descripcion()"
              (ngModelChange)="descripcion.set($event)"></textarea>
          </div>

          <div class="flex items-center gap-2 pt-1 border-t border-default-100">
            <input type="checkbox" id="activo-edit" class="size-4 rounded"
              [ngModel]="activo()"
              (ngModelChange)="activo.set($event)" />
            <label for="activo-edit" class="text-sm text-default-700 cursor-pointer">
              Formulario activo (visible en el portal)
            </label>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="button" (click)="onSubmit()" [disabled]="saving()"
              class="btn bg-violet-600 text-white hover:bg-violet-700 flex items-center gap-1.5 disabled:opacity-60">
              @if (saving()) {
                <ng-icon name="lucideLoader" class="size-4 animate-spin"></ng-icon>
                Guardando...
              } @else {
                <ng-icon name="lucideCheck" class="size-4"></ng-icon>
                Guardar cambios
              }
            </button>
            <a routerLink="/cenefco/generador-formularios"
               class="btn border border-default-300 text-default-600">
              Cancelar
            </a>
            <a [routerLink]="['/cenefco/generador-formulario-campos', id()]"
               class="btn border border-violet-300 text-violet-700 hover:bg-violet-50 flex items-center gap-1.5 ml-auto">
              <ng-icon name="lucideLayoutList" class="size-4"></ng-icon>
              Editar campos
            </a>
          </div>
        </div>
      </div>
    </div>
  }
</main>
