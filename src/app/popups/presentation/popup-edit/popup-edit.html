<main>
  <app-page-title title="Editar Popup" subtitle="Popups" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Configuración del Popup</h4></div>
      <div class="p-6">
        @if (loading()) {
          <div class="flex items-center justify-center py-16 text-default-500 text-sm gap-2"><div class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Cargando...</div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Título</label>
              <input type="text" formControlName="titulo" class="form-input w-full">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Contenido</label>
              <textarea formControlName="contenido" rows="4" class="form-input w-full"></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Imagen</label>
              @if (imgPreview()) {
                <div class="relative inline-block">
                  <img [src]="imgPreview()!" alt="Vista previa" class="h-40 w-full max-w-md rounded-lg object-cover border border-default-200">
                  @if (uploadingImg()) {
                    <div class="absolute inset-0 flex items-center justify-center bg-black/40 rounded-lg">
                      <div class="size-5 animate-spin text-white"><ng-icon name="lucideLoader"></ng-icon></div>
                    </div>
                  } @else {
                    <button type="button" (click)="removeImagen()" class="absolute -top-2 -end-2 size-6 rounded-full bg-danger text-white flex items-center justify-center shadow" title="Quitar imagen">
                      <div class="size-3"><ng-icon name="lucideX"></ng-icon></div>
                    </button>
                  }
                </div>
              } @else {
                <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-default-300 rounded-lg cursor-pointer hover:border-primary hover:bg-primary/5 transition-colors">
                  <div class="flex flex-col items-center gap-2 text-default-400">
                    <div class="size-8"><ng-icon name="lucideImagePlus"></ng-icon></div>
                    <span class="text-xs">Haz clic para subir una imagen</span>
                    <span class="text-xs text-default-300">PNG, JPG, WEBP — máx. 20 MB</span>
                  </div>
                  <input type="file" accept="image/*" class="hidden" (change)="onImagenSelected($event)">
                </label>
              }

              <div class="flex items-start gap-2 px-3 py-2 mt-2 bg-warning/10 border border-warning/30 rounded-lg">
                <div class="size-4 text-warning shrink-0 mt-0.5"><ng-icon name="lucideTriangleAlert"></ng-icon></div>
                <p class="text-xs text-default-600">
                  Tamaño sugerido: <strong>600×400 px</strong> (máx. 400 KB). Un popup con imagen muy pesada tarda en aparecer y afecta la experiencia del visitante.
                </p>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">URL del Enlace</label>
              <input type="text" formControlName="enlace_url" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Texto del Enlace</label>
              <input type="text" formControlName="enlace_texto" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Posición</label>
              <select formControlName="posicion" class="form-input w-full">
                <option value="center">Centro</option><option value="top">Arriba</option>
                <option value="bottom">Abajo</option><option value="top-left">Arriba izquierda</option>
                <option value="top-right">Arriba derecha</option><option value="bottom-left">Abajo izquierda</option>
                <option value="bottom-right">Abajo derecha</option>
              </select>
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Delay (segundos)</label>
              <input type="number" formControlName="delay_segundos" class="form-input w-full" min="0">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Fecha de Inicio</label>
              <input type="date" formControlName="fecha_inicio" class="form-input w-full">
            </div>
            <div>
              <label class="block text-sm font-medium text-default-700 mb-1">Fecha de Fin</label>
              <input type="date" formControlName="fecha_fin" class="form-input w-full">
            </div>
            <div class="md:col-span-2 flex flex-wrap items-center gap-6">
              <div class="flex items-center gap-2"><input type="checkbox" formControlName="mostrar_una_vez_sesion" id="sesion" class="form-checkbox"><label for="sesion" class="text-sm text-default-700">Una vez por sesión</label></div>
              <div class="flex items-center gap-2"><input type="checkbox" formControlName="mostrar_una_vez_siempre" id="siempre" class="form-checkbox"><label for="siempre" class="text-sm text-default-700">Una sola vez (siempre)</label></div>
              <div class="flex items-center gap-2"><input type="checkbox" formControlName="activo" id="activo" class="form-checkbox"><label for="activo" class="text-sm text-default-700">Activo</label></div>
            </div>
            <div class="md:col-span-2 flex items-center gap-3">
              <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
                @if (submitting()) { <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando... } @else { Actualizar Popup }
              </button>
              <a routerLink="/cenefco/popups" class="btn bg-default-200 text-default-700">Cancelar</a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</main>
