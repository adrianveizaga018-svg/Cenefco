<main>
  <app-page-title title="Editar Programa Académico" subtitle="Programas Académicos" />
  <div class="grid grid-cols-1 gap-5 mb-5">
    <div class="card">
      <div class="card-header"><h4 class="card-title">Datos del Programa</h4></div>
      <div class="p-6">
        @if (loading()) {
          <div class="flex items-center justify-center py-16 text-default-500 text-sm gap-2"><div class="size-4 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Cargando...</div>
        } @else {
          <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-default-700 mb-1">Nombre del Programa <span class="text-danger">*</span></label>
              <input type="text" formControlName="nombre_programa" class="form-input w-full">
              @if (form.get('nombre_programa')?.invalid && form.get('nombre_programa')?.touched) { <p class="text-danger text-xs mt-1">El nombre es requerido</p> }
            </div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">ID Tipo de Programa</label><input type="number" formControlName="id_tipoprograma" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Inversión</label><input type="text" formControlName="inversion" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Creditaje</label><input type="text" formControlName="creditaje" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">URL Video</label><input type="url" formControlName="url_video" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Inicio de Actividades</label><input type="date" formControlName="inicio_actividades" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Fin de Actividades</label><input type="date" formControlName="finalizacion_actividades" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Inicio de Inscripciones</label><input type="date" formControlName="inicio_inscripciones" class="form-input w-full"></div>
            <div><label class="block text-sm font-medium text-default-700 mb-1">Estado</label>
              <select formControlName="estado" class="form-input w-full"><option [value]="1">Activo</option><option [value]="0">Inactivo</option></select>
            </div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Descripción</label><textarea formControlName="descripcion" rows="3" class="form-input w-full"></textarea></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Objetivo</label><textarea formControlName="objetivo" rows="3" class="form-input w-full"></textarea></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Dirigido a</label><textarea formControlName="dirigido" rows="2" class="form-input w-full"></textarea></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Requisitos</label><textarea formControlName="requisitos" rows="2" class="form-input w-full"></textarea></div>
            <div class="md:col-span-2"><label class="block text-sm font-medium text-default-700 mb-1">Nota</label><textarea formControlName="nota" rows="2" class="form-input w-full"></textarea></div>
            <div class="md:col-span-2 flex items-center gap-3">
              <button type="submit" class="btn bg-primary text-white" [disabled]="submitting()">
                @if (submitting()) { <div class="size-4 me-2 animate-spin"><ng-icon name="lucideLoader"></ng-icon></div> Guardando... }
                @else { Guardar Cambios }
              </button>
              <a routerLink="/cenefco/programas-academicos" class="btn bg-default-200 text-default-700">Cancelar</a>
            </div>
          </form>
        }
      </div>
    </div>
  </div>
</main>
